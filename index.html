<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="がっこう手帳">
  <title>がっこう手帳</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">がっこう手帳</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="メニュー">
    <button data-tab="today" class="active"><span class="ico">🏠</span>今日</button>
    <button data-tab="timetable"><span class="ico">🗓️</span>時間割</button>
    <button data-tab="tasks"><span class="ico">📝</span>提出物</button>
    <button data-tab="tests"><span class="ico">✏️</span>テスト勉強</button>
    <button data-tab="settings"><span class="ico">⚙️</span>設定</button>
  </nav>

  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>

  <script src="app.js"></script>
</body>
</html>
